[package]
name = "roadside-picnic"
version = "0.1.0"
edition = "2024"

[dependencies]
# Game engine — the only engine in this project.
#
# `3d` + `ui` instead of default features keeps the build lean; `audio` is
# needed for ambient sound, `wav` for the synthesized WAV loop. Audio on
# Linux requires ALSA dev libraries (`libasound2-dev`), which are installed
# on this machine. `ktx2` + `zstd_rust` load the GLB textures that
# tools/compress_glb_textures.py precompiles to BC7/BC5 with mip chains.
bevy = { version = "0.20.1", default-features = false, features = ["3d", "ui", "audio", "wav", "jpeg", "ktx2", "zstd_rust"] }

# Where wgpu builds its Vulkan backend (the same cfg as `read_vram`): the
# driver's live VRAM budget, read through that backend
# (`src/assets/gpu_scans/vram.rs`). Both are the versions Bevy already builds,
# with no new features, so nothing new is compiled.
[target.'cfg(any(windows, target_os = "linux", target_os = "android", target_os = "freebsd"))'.dependencies]
ash = "0.38"
wgpu = { version = "30", default-features = false, features = ["vulkan"] }

[features]
# Offline meshlet preprocessing of dense UHD scans for Bevy's virtual geometry
# (slow, pulls meshopt + metis); only used by `examples/meshletize.rs`.
meshlet_processor = ["bevy/meshlet_processor"]
# Development only (`cargo dev`, `.cargo/config.toml`): Bevy linked as a shared
# library so an edit relinks in seconds, and assets reloaded on save. Never in
# release, playtest (its FPS must match release) or wasm32 builds.
dev = ["bevy/dynamic_linking", "bevy/file_watcher"]

[[example]]
name = "meshletize"
required-features = ["meshlet_processor"]

# --- Release build: prioritize runtime speed (shipping). ---
[profile.release]
lto = "thin"
codegen-units = 1

# --- Playtest build: release-speed game that rebuilds fast (`--profile playtest`). ---
# Without cross-crate LTO, and with the game split into 16 parallel units, an edit
# rebuilds in ~36 s instead of ~3.5 min; CPU frame time stays within a few percent.
[profile.playtest]
inherits = "release"
lto = false
codegen-units = 16

# --- Dev build: small amount of optimization for our code, full for dependencies. ---
# Makes running the game via `cargo run` actually playable while keeping rebuilds fast.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
